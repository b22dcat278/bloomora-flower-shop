<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloomora Admin</title><style>body{font-family:Arial;margin:0;background:#f6f1eb;color:#29241f}header{padding:20px 6%;background:#fff;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:35px auto;padding:0 20px}.card{background:#fff;border-radius:16px;padding:24px;margin-bottom:20px}input,button,select{padding:11px;border:1px solid #ddd;border-radius:8px}button{cursor:pointer}.login{max-width:400px;margin:100px auto}.hide{display:none}.order{padding:15px 0;border-top:1px solid #eee}.error{color:#a33}</style></head><body><header><b>✿ BLOOMORA ADMIN</b><button onclick="logout()">Đăng xuất</button></header><main class="wrap"><section id="login" class="card login"><h2>Đăng nhập</h2><input id="email" type="email" placeholder="Email quản trị" style="width:100%;box-sizing:border-box"><br><br><input id="password" type="password" placeholder="Mật khẩu" style="width:100%;box-sizing:border-box"><br><br><button onclick="login()">Đăng nhập</button><p id="err" class="error"></p></section><section id="app" class="hide"><div class="card"><h2>Đơn hàng</h2><div id="orders"></div></div></section></main><script>let token=localStorage.getItem('bloomora-admin'),$=id=>document.getElementById(id);function show(){$('login').classList.toggle('hide',!!token);$('app').classList.toggle('hide',!token);if(token)load()}async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})}),j=await r.json();if(!r.ok)return $('err').textContent=j.error||'Đăng nhập thất bại';token=j.token;localStorage.setItem('bloomora-admin',token);show()}function logout(){localStorage.removeItem('bloomora-admin');token=null;show()}async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(url,opt);if(r.status===401){logout();return[]}return r.json()}async function load(){const o=await api('/api/admin/orders');$('orders').innerHTML=o.map(x=>`<div class="order"><b>${x.order_code}</b> · ${x.customer_name} · ${x.phone}<br>${x.address}<br><strong>${new Intl.NumberFormat('vi-VN').format(x.total)}₫</strong><br><select onchange="status(${x.id},this.value)"><option ${x.status==='new'?'selected':''}>new</option><option ${x.status==='confirmed'?'selected':''}>confirmed</option><option ${x.status==='delivering'?'selected':''}>delivering</option><option ${x.status==='completed'?'selected':''}>completed</option><option ${x.status==='cancelled'?'selected':''}>cancelled</option></select></div>`).join('')||'<p>Chưa có đơn.</p>'}async function status(id,status){await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});load()}show();</script></body></html>
